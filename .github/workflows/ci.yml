name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e "./backend[dev]"
      - name: Lint
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
      - name: Type check
        working-directory: backend
        run: mypy src
      - name: Test
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci
      - name: Build
        working-directory: frontend
        run: npm run build
      - name: Bundle package static assets
        run: |
          rm -rf backend/src/yt_gpt/server/static
          mkdir -p backend/src/yt_gpt/server/static
          cp -R frontend/dist/. backend/src/yt_gpt/server/static/
      - name: Verify committed bundle
        run: |
          if [ -n "$(git status --porcelain -- backend/src/yt_gpt/server/static)" ]; then
            git status --porcelain -- backend/src/yt_gpt/server/static
            echo "Frontend bundle is out of date. Rebuild and commit backend/src/yt_gpt/server/static." >&2
            exit 1
          fi
