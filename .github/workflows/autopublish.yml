name: autopublish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          python - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"].strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[._+-]?[0-9A-Za-z.-]+)?", version):
              sys.exit(f"Not a valid version: {version!r}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_MODE: http
          VITE_API_URL: ""
        run: npm run build

      - name: Bundle frontend into the package
        run: |
          rm -rf backend/src/yt_gpt/server/static
          mkdir -p backend/src/yt_gpt/server/static
          cp -R frontend/dist/. backend/src/yt_gpt/server/static/

      - name: Set package version
        run: |
          python - <<'PY'
          import os, pathlib
          version = os.environ["VERSION"].strip()
          path = pathlib.Path("backend/src/yt_gpt/version.py")
          path.write_text(f'__version__ = "{version}"\n', encoding="utf-8")
          PY

      - name: Build sdist and wheel
        working-directory: backend
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish with trusted publishing
        if: ${{ secrets.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/

      - name: Publish with API token
        if: ${{ secrets.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/
          password: ${{ secrets.PYPI_API_TOKEN }}
