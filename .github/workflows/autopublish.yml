name: autopublish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, for example 0.1.1"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: pypi-${{ inputs.version }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/yt-gpt
    env:
      VERSION: ${{ inputs.version }}
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        run: |
          python - <<'PY'
          import os, re, sys
          version = os.environ["VERSION"].strip()
          if not re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+(?:[._+-]?[0-9A-Za-z.-]+)?", version):
              sys.exit(f"Not a valid version: {version!r}")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Set release version
        run: |
          python - <<'PY'
          import json, os, pathlib, re

          version = os.environ["VERSION"].strip()
          root = pathlib.Path(".")

          def replace_version(path: pathlib.Path, pattern: str, replacement: str) -> None:
              text = path.read_text(encoding="utf-8")
              updated, count = re.subn(pattern, replacement, text)
              if count == 0:
                  raise SystemExit(f"No version literal found in {path}")
              path.write_text(updated, encoding="utf-8")

          replace_version(
              root / "backend/src/yt_gpt/version.py",
              r'__version__ = "[^"]+"',
              f'__version__ = "{version}"',
          )
          replace_version(
              root / "frontend/src/data/site.ts",
              r"version:\s*'[0-9]+\.[0-9]+\.[0-9]+[^']*'",
              f"version: '{version}'",
          )
          replace_version(
              root / "frontend/src/api/http.ts",
              r"version:\s*'[0-9]+\.[0-9]+\.[0-9]+[^']*'",
              f"version: '{version}'",
          )

          package = root / "frontend/package.json"
          data = json.loads(package.read_text(encoding="utf-8"))
          data["version"] = version
          package.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")

          lock = root / "frontend/package-lock.json"
          data = json.loads(lock.read_text(encoding="utf-8"))
          data["version"] = version
          data.setdefault("packages", {}).setdefault("", {})["version"] = version
          lock.write_text(json.dumps(data, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_MODE: http
          VITE_API_URL: ""
        run: npm run build

      - name: Bundle frontend into the package
        run: |
          rm -rf backend/src/yt_gpt/server/static
          mkdir -p backend/src/yt_gpt/server/static
          cp -R frontend/dist/. backend/src/yt_gpt/server/static/

      - name: Install backend development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e "./backend[dev]"

      - name: Verify backend
        working-directory: backend
        run: |
          ruff check .
          ruff format --check .
          mypy src
          pytest -q

      - name: Build sdist and wheel
        working-directory: backend
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish with trusted publishing
        if: ${{ env.PYPI_API_TOKEN == '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/

      - name: Publish with API token
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: backend/dist/
          password: ${{ env.PYPI_API_TOKEN }}
