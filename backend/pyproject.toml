[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "yt-gpt"
dynamic = ["version"]
description = "A local, NotebookLM-style workspace for YouTube: transcripts, retrieval and grounded chat."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "yt-gpt contributors" }]
keywords = ["youtube", "transcripts", "llm", "rag", "notebooklm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Web Environment",
  "Intended Audience :: End Users/Desktop",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Video",
  "Topic :: Text Processing :: Indexing",
]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "httpx>=0.27",
  "yt-dlp>=2024.10.7",
  "litellm>=1.50",
  "numpy>=1.26",
  "keyring>=25",
  "argon2-cffi>=23.1",
  "imageio-ffmpeg>=0.5",
  "Pillow>=10.0",
  "imagehash>=4.3",
  "tomli>=2.0; python_version < '3.11'",
  "tomli-w>=1.0",
]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.0"]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "ruff>=0.6",
  "mypy>=1.10",
  "build>=1.2",
]
all = ["yt-gpt[whisper]"]

[project.scripts]
yt-gpt = "yt_gpt.cli:main"

[project.urls]
Homepage = "https://github.com/anomalyco/yt-gpt"
Documentation = "https://github.com/anomalyco/yt-gpt#readme"
Issues = "https://github.com/anomalyco/yt-gpt/issues"

[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = { attr = "yt_gpt.version.__version__" }

[tool.setuptools.package-data]
yt_gpt = ["server/static/**/*", "server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
